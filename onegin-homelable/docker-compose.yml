version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: onegin-homelable_frontend_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  backend:
    image: ghcr.io/pouzor/homelable-backend:3.5.0
    restart: on-failure
    environment:
      SECRET_KEY: "b04d5abd4e9f8a46c6ac82ec867ce3bfbea08b511bea881158761c5508f0607a"
      AUTH_USERNAME: "admin"
      AUTH_PASSWORD_HASH: "$$2b$$12$$KTCfMx4sTjkd0Pj68R2PDupwcvP9LZaDckZosSkQj9avuOP8Zxm7S"
      SQLITE_PATH: /app/data/homelab.db
      CORS_ORIGINS: '["*"]'
      SCANNER_RANGES: '["192.168.1.0/24"]'
      STATUS_CHECKER_INTERVAL: "60"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    networks:
      - homelable
    cap_add:
      - NET_RAW

  frontend:
    image: ghcr.io/pouzor/homelable-frontend:3.5.0
    restart: on-failure
    depends_on:
      - backend
    networks:
      - homelable

networks:
  homelable:
    driver: bridge
