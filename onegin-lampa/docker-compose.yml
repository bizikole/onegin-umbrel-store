version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: onegin-lampa_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  init:
    image: alpine:3.22
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache curl unzip >/dev/null
        version="1.4.1"
        if [ -f /data/.lampa-version ] && [ "$(cat /data/.lampa-version)" = "$version" ] && [ -f /data/index.html ]; then
          exit 0
        fi
        rm -rf /tmp/lampa
        mkdir -p /tmp/lampa /data
        curl -fL --retry 5 --retry-delay 2           "https://github.com/yumata/lampa/releases/download/v${version}/lampa-portable.zip"           -o /tmp/lampa.zip
        unzip -q /tmp/lampa.zip -d /tmp/lampa
        src="$(dirname "$(find /tmp/lampa -type f -name index.html -print -quit)")"
        test -n "$src" && test -f "$src/index.html"
        rm -rf /data/*
        cp -a "$src"/. /data/
        printf '%s\n' "$version" > /data/.lampa-version

  web:
    image: nginx:1.29-alpine
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data:/usr/share/nginx/html:ro
