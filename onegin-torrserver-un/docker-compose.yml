version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: onegin-torrserver-un_server_1
      APP_PORT: 8090

  server:
    image: debian:bookworm-slim
    restart: on-failure

    environment:
      MATRIX_TAG: MatriX.145.UN
      TS_PORT: 8090
      TS_PATH: /opt/ts/config
      TS_TORRENTSDIR: /opt/ts/torrents

    volumes:
      - ${APP_DATA_DIR}/data:/opt/ts

    entrypoint: ["/bin/sh", "-ec"]
    command: |
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl jq
      rm -rf /var/lib/apt/lists/*

      mkdir -p "$$TS_PATH" "$$TS_TORRENTSDIR"

      arch="$$(uname -m)"
      case "$$arch" in
        x86_64) pattern="linux-amd64" ;;
        aarch64) pattern="linux-arm64" ;;
        armv7l|armv7*) pattern="linux-arm7" ;;
        *) echo "Unsupported architecture: $$arch" >&2; exit 1 ;;
      esac

      binary="/opt/ts/TorrServer"
      marker="/opt/ts/.matrix-tag"

      if [ ! -x "$$binary" ] || [ ! -f "$$marker" ] || [ "$$(cat "$$marker")" != "$$MATRIX_TAG" ]; then
        echo "Downloading ByLampa Matrix $$MATRIX_TAG..."
        api="https://api.github.com/repos/bylampa/Matrix/releases/tags/$$MATRIX_TAG"

        json="$$(curl -fsSL \
          -H 'Accept: application/vnd.github+json' \
          -A 'onegin-umbrel-store' \
          "$$api")"

        asset_url="$$(printf '%s' "$$json" | jq -r --arg p "$$pattern" \
          '.assets[] | select(.name | contains($$p)) | .browser_download_url' | head -n 1)"

        if [ -z "$$asset_url" ] || [ "$$asset_url" = "null" ]; then
          echo "ERROR: no $$pattern asset found in ByLampa release $$MATRIX_TAG" >&2
          exit 1
        fi

        echo "Asset: $$asset_url"
        curl -fL --retry 5 --retry-delay 2 "$$asset_url" -o "$$binary.tmp"
        chmod +x "$$binary.tmp"
        mv "$$binary.tmp" "$$binary"
        printf '%s\\n' "$$MATRIX_TAG" > "$$marker"
      fi

      exec "$$binary" \
        --port "$$TS_PORT" \
        --path "$$TS_PATH" \
        --torrentsdir "$$TS_TORRENTSDIR"
