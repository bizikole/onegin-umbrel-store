version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: onegin-torrserver_server_1
      APP_PORT: 8090

  server:
    image: ghcr.io/yourok/torrserver:MatriX.145
    restart: on-failure
    environment:
      TS_PORT: 8090
      TS_DONTKILL: "1"
      TS_HTTPAUTH: "0"
      TS_CONF_PATH: /opt/ts/config
      TS_TORR_DIR: /opt/ts/torrents
    volumes:
      - ${APP_DATA_DIR}/data:/opt/ts
